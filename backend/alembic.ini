[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
version_path_separator = os
# Never put real credentials here; env.py loads DATABASE_URL via app.core.config
sqlalchemy.url = postgresql+psycopg://foxus:password@localhost:5432/foxus

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
