services:
  postgres:
    image: postgres:16-alpine
    container_name: foxus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: foxus
      POSTGRES_PASSWORD: password
      POSTGRES_DB: foxus
    ports:
      - "5432:5432"
    volumes:
      - foxus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxus -d foxus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  foxus_pgdata:
